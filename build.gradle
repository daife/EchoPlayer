plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group
version = mod_version

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'parchment', version: parchment_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                echoplayer {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files('libs/MixinExtras-0.4.1.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor files('libs/MixinExtras-0.4.1.jar')
}

mixin {
    add sourceSets.main, 'echoplayer.refmap.json'
    config 'echoplayer.mixins.json'
    config 'echoplayer.forge.mixins.json'
}

tasks.named('processResources').configure {
    exclude 'echoplayer.refmap.json'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'Theus452',
            'Specification-Version': mod_version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Theus452',
            'Built-On-Minecraft': minecraft_version,
            'MixinConfigs': 'echoplayer.mixins.json,echoplayer.forge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
