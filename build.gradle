plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group
version = mod_version

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'parchment', version: parchment_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                echoplayer {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.threetag.net'
        content { includeGroup 'net.threetag' }
    }
    maven { url = 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files('libs/MixinExtras-0.4.1.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor files('libs/MixinExtras-0.4.1.jar')
    compileOnly fg.deobf("net.threetag:palladium-forge:${palladium_version}:forge", { transitive = false })
    compileOnly fg.deobf("net.threetag:palladiumcore-forge:${palladiumcore_version}:forge", { transitive = false })
    compileOnly fg.deobf("curse.maven:pantheonsent-968457:${pantheonsent_file_id}", { transitive = false })
}

mixin {
    add sourceSets.main, 'echoplayer.refmap.json'
    config 'echoplayer.mixins.json'
    config 'echoplayer.forge.mixins.json'
}

tasks.named('processResources').configure {
    exclude 'echoplayer.refmap.json'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'Theus452',
            'Specification-Version': mod_version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Theus452',
            'Built-On-Minecraft': minecraft_version,
            'MixinConfigs': 'echoplayer.mixins.json,echoplayer.forge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Opt-in integration tests run in an isolated world; none of these classes,
// fixtures or runtime mods are included in the published jars.
if (providers.gradleProperty('compatTests').isPresent()) {
    def compatTestRunDir = project.file(providers.gradleProperty('compatWithoutPalladium').isPresent()
        ? 'run/compat-tests-base' : 'run/compat-tests-palladium')
    sourceSets {
        gameTest {
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
    }
    if (providers.gradleProperty('compatWithoutPalladium').isPresent()) {
        sourceSets.gameTest.java.exclude '**/PalladiumGameTests.java'
    } else {
        repositories {
            maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
            maven { url = 'https://maven.kosmx.dev/' }
            maven { url = 'https://api.modrinth.com/maven' }
            maven { url = 'https://maven.architectury.dev/' }
        }
        dependencies {
            runtimeOnly fg.deobf("net.threetag:palladium-forge:${palladium_version}:forge", { transitive = false })
            runtimeOnly fg.deobf("net.threetag:palladiumcore-forge:${palladiumcore_version}:forge", { transitive = false })
            runtimeOnly fg.deobf("curse.maven:pantheonsent-968457:${pantheonsent_file_id}", { transitive = false })
            runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}", { transitive = false })
            runtimeOnly fg.deobf("maven.modrinth:sherdsapi:${sherdsapi_version}", { transitive = false })
            runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}", { transitive = false })
        }
    }
    minecraft.runs {
        gameTestServer {
            workingDirectory compatTestRunDir
            property 'forge.enabledGameTestNamespaces', 'echoplayer'
            mods {
                echoplayer_gametest { source sourceSets.gameTest }
            }
        }
    }
    tasks.configureEach {
        if (name == 'prepareRunGameTestServer') {
            doLast {
                copy {
                    from sourceSets.gameTest.resources.matching { include 'gameteststructures/**' }
                    into compatTestRunDir
                }
            }
        }
    }
}
